name: Publish verified app release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version (published releases are never overwritten)
        required: true
        default: '0.5.7'
permissions:
  contents: read
concurrency:
  group: public-app-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'originalclassicprocess/Automesh'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/release-context.mjs
      - run: npm ci --ignore-scripts
      - run: npm --prefix nodes ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run i18n:check
      - run: node scripts/check-public-node-source.mjs
      - run: npm run check:core
      - run: npm test
      - run: npm run release -- --output .release/automesh-public-release
      - run: node scripts/test-pwa-shell.mjs
      - run: npm run test:production
      - name: Validate and archive the public package
        shell: bash
        run: |
          node --input-type=module -e "import {validateRelease} from './server/deployment.mjs'; validateRelease('.release/automesh-public-release');"
          mkdir -p .release/publication
          tar -czf ".release/publication/Automesh-App-$RELEASE_VERSION-update.tar.gz" -C .release/automesh-public-release .
          cp .release/automesh-public-release/docs/build-info.json ".release/publication/Automesh-App-$RELEASE_VERSION-source.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .release/publication/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-app-release
          path: .release/publication/
          include-hidden-files: true # Only the verified archive and public source metadata.
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'originalclassicprocess/Automesh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-app-release
          path: .release/publication
      - name: Verify source before publishing
        shell: bash
        run: |
          node scripts/release-context.mjs
          gh attestation verify ".release/publication/Automesh-App-$RELEASE_VERSION-update.tar.gz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners --cert-oidc-issuer https://token.actions.githubusercontent.com --predicate-type https://slsa.dev/provenance/v1
      - name: Publish versioned assets
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite'; exit 1; fi
          gh release create "$tag" .release/publication/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Automesh $RELEASE_VERSION" --notes-file "docs/RELEASE_${RELEASE_VERSION//./_}.md" --latest
