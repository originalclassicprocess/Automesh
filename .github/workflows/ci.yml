name: Code checks
on:
  push:
    branches: [main, 'codex/public-readiness-*']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix nodes ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm --prefix nodes audit --audit-level=moderate
      - run: npm run check
      - run: npm run i18n:check
      - run: node scripts/check-public-node-source.mjs
      - run: npm run check:core
      - run: npm test
      - run: npm run build
      - run: node scripts/test-pwa-shell.mjs
      - run: npm run test:production
  notifier:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: node scripts/build-notifier.mjs
      - run: npm --prefix plugins/automesh-notifier test
      - run: python scripts/package-notifier.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automesh-notifier
          path: .release/automesh-notifier-*.zip
          include-hidden-files: true # Only the prepared credential-free ZIP.
          if-no-files-found: error
          retention-days: 14
