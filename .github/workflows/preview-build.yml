name: Build app preview (no deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix nodes ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run i18n:check
      - run: node scripts/check-public-node-source.mjs
      - run: npm run check:core
      - run: npm test
      - run: npm run release -- --output .release/automesh-public-candidate
      - run: node scripts/test-pwa-shell.mjs
      - run: npm run test:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automesh-app-preview
          path: .release/automesh-public-candidate/
          include-hidden-files: true # Only the prepared allowlisted release.
          if-no-files-found: error
          retention-days: 14
